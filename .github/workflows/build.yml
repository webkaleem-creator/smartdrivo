name: Build SmartDrivo APK

on:
  push:
    branches: [ main, smartdrivo-device-lock-free-20261011-112401, perf/rapido-stage-a-safe-latency-20261031, ui/history-premium-v1.0.10-20261101 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.app_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Restore Firebase Configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/google-services.json"

      - name: Restore Release Keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Run Debug Regression Tests
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-configuration-cache

      - name: Read App Version
        id: app_version
        shell: bash
        run: |
          APP_VERSION=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building SmartDrivo v$APP_VERSION"

      - name: Prepare Final APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "SmartDrivo-v${APP_VERSION}-release.apk"
          test -f "SmartDrivo-v${APP_VERSION}-release.apk"

      - name: Verify APK Signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK="SmartDrivo-v${APP_VERSION}-release.apk"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          EXPECTED_CERT=$(grep -m1 'private const val RELEASE_CERT_SHA256 = "'             app/src/main/java/com/example/security/SignatureIntegrity.kt             | sed -E 's/.*"([0-9A-Fa-f]+)".*/\1/'             | tr '[:lower:]' '[:upper:]')

          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK"             | sed -n 's/.*certificate SHA-256 digest: //p'             | head -1             | tr -d ':'             | tr '[:lower:]' '[:upper:]')

          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"

          echo "Expected release certificate SHA-256: $EXPECTED_CERT"
          echo "Actual APK certificate SHA-256:        $ACTUAL_CERT"

          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "ERROR: Release APK certificate does not match SmartDrivo integrity lock."
            exit 1
          fi

          echo "SmartDrivo release certificate: MATCH"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartDrivo-v${{ env.APP_VERSION }}-Release
          path: SmartDrivo-v${{ env.APP_VERSION }}-release.apk

  publish_release:
    name: Publish verified signed APK to GitHub Releases
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout release notes and version
        uses: actions/checkout@v4

      - name: Download signed APK from this successful build
        uses: actions/download-artifact@v4
        with:
          name: SmartDrivo-v${{ needs.build.outputs.app_version }}-Release
          path: release

      - name: Validate signed APK and version before publishing
        shell: bash
        env:
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          set -euo pipefail
          APK="release/SmartDrivo-v${APP_VERSION}-release.apk"
          test -f "$APK"
          test "$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')" = "$APP_VERSION"
          EXPECTED_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --print-certs "$APK"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.smartdrivo.app'"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_CODE'"
          echo "$BADGING" | grep -F "versionName='$APP_VERSION'"
          EXPECTED_CERT=$(grep -m1 'private const val RELEASE_CERT_SHA256 = "' app/src/main/java/com/example/security/SignatureIntegrity.kt | sed -E 's/.*"([0-9A-Fa-f]+)".*/\1/' | tr '[:lower:]' '[:upper:]')
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test -n "$EXPECTED_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          sha256sum "$APK"

      - name: Publish release only for a new version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          APK="release/SmartDrivo-v${APP_VERSION}-release.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; never replace its signed APK."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists without a Release; refusing ambiguous overwrite."
            exit 1
          fi
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SmartDrivo $TAG" \
            --notes-file "RELEASE_NOTES_v1.0.11.md" \
            --latest
