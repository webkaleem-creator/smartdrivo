<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDrivo Admin | Secure Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    // Immediate auth check: if already logged in this session, skip to dashboard
    if (sessionStorage.getItem('smartdrivo_admin_auth') === 'true') {
      window.location.replace('index.html');
    }
  </script>
  <style>
    :root {
      --primary: #FF6600;
      --primary-hover: #E65100;
      --primary-light: rgba(255, 102, 0, 0.12);
      --bg-dark: #0F1115;
      --card-dark: #181B20;
      --card-border: #262B34;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --error-bg: #450A0A;
      --error-text: #F87171;
      --error-border: #991B1B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: radial-gradient(circle at top center, #1E1B18 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 102, 0, 0.08);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #FF7A00 0%, #E65100 100%);
      color: #FFFFFF;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 8px 24px rgba(255, 102, 0, 0.35);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .error-alert {
      display: none;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      padding: 13px 42px 13px 42px;
      background: #0D0F12;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      color: #FFFFFF;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .form-input:focus + .input-icon,
    .form-input:focus ~ .input-icon {
      color: var(--primary);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--primary);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(255, 102, 0, 0.3);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(255, 102, 0, 0.45);
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .security-note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--card-border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #38BDF8;
      font-weight: 600;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-logo">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <h1 class="brand-title">SmartDrivo Admin</h1>
        <p class="brand-subtitle">Secure Administration & Fleet Management</p>
      </div>

      <div id="errorMessage" class="error-alert">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="errorText">Invalid username or password. Please try again.</span>
      </div>

      <form id="loginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label for="username">Admin Email / Username</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="username" 
              class="form-input" 
              placeholder="Enter admin email address"
              autocomplete="email"
              required 
              autofocus
            >
            <i class="fa-solid fa-user-shield input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Admin Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="Enter secure password"
              autocomplete="current-password"
              required
            >
            <i class="fa-solid fa-lock input-icon"></i>
            <button 
              type="button" 
              class="toggle-password" 
              onclick="togglePasswordVisibility()" 
              aria-label="Toggle password visibility"
            >
              <i id="eyeIcon" class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-login">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Login to Admin Panel</span>
        </button>
      </form>

      <div class="security-note">
        <div class="security-badge">
          <i class="fa-solid fa-lock"></i> Firebase Secured Admin Portal
        </div>
        <p>Protected by Firebase Authentication & Firestore RBAC.</p>
      </div>
    </div>
  </div>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Real Firebase Configuration matching project smartdrivo
    const firebaseConfig = {
      apiKey: "AIzaSyCBC-GSydq4ZgJF_nP9-p1zPdelhZRIvsc",
      authDomain: "smartdrivo.firebaseapp.com",
      projectId: "smartdrivo",
      storageBucket: "smartdrivo.firebasestorage.app",
      messagingSenderId: "726018491881",
      appId: "1:726018491881:web:smartdrivo"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorBox = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');

      const email = usernameInput.value.trim();
      const pass = passwordInput.value;

      errorBox.style.display = 'none';
      loginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
      loginBtn.disabled = true;

      try {
        // 1. Sign in with real Firebase Authentication
        const userCredential = await auth.signInWithEmailAndPassword(email, pass);
        const user = userCredential.user;

        if (!user) {
          throw new Error("Unable to authenticate with Firebase.");
        }

        loginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying Admin Access...';

        // 2. Fetch and verify /users/{uid} document in Firestore
        let isAdmin = false;
        let adminData = null;

        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          adminData = userDoc.data();
          isAdmin = (adminData.isAdmin === true);
        } else {
          // Fallback: check query by email if document ID is different
          const querySnap = await db.collection('users').where('email', '==', email).limit(1).get();
          if (!querySnap.empty) {
            adminData = querySnap.docs[0].data();
            isAdmin = (adminData.isAdmin === true);
          }
        }

        // 3. Strict Admin Access Gate
        if (!isAdmin) {
          await auth.signOut();
          sessionStorage.clear();
          errorText.textContent = `Access Denied: Account (${email}) does not have Administrator privileges. Access is restricted to SmartDrivo admins.`;
          errorBox.style.display = 'flex';
          loginBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> <span>Login to Admin Panel</span>';
          loginBtn.disabled = false;
          return;
        }

        // 4. Save session authentication in sessionStorage
        sessionStorage.setItem('smartdrivo_admin_auth', 'true');
        sessionStorage.setItem('smartdrivo_admin_uid', user.uid);
        sessionStorage.setItem('smartdrivo_admin_email', user.email || email);
        sessionStorage.setItem('smartdrivo_admin_user', (adminData && adminData.name) ? adminData.name : (user.email || 'Admin'));
        sessionStorage.setItem('smartdrivo_admin_logged_at', new Date().toISOString());

        loginBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>Access Granted! Loading...</span>';

        setTimeout(() => {
          window.location.replace('index.html');
        }, 350);

      } catch (err) {
        console.error("Firebase Admin Login Error:", err);
        let message = "Authentication failed. Please check your credentials.";
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          message = "Invalid email or password. Please verify your admin credentials.";
        } else if (err.code === 'auth/invalid-email') {
          message = "Please enter a valid email address.";
        } else if (err.code === 'auth/user-disabled') {
          message = "This admin account has been disabled by security policy.";
        } else if (err.code === 'auth/too-many-requests') {
          message = "Too many failed attempts. Please try again in a few minutes.";
        } else if (err.message) {
          message = err.message;
        }

        errorText.textContent = message;
        errorBox.style.display = 'flex';
        loginBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> <span>Login to Admin Panel</span>';
        loginBtn.disabled = false;
        passwordInput.value = '';
        passwordInput.focus();
      }
    }
  </script>

</body>
</html>
