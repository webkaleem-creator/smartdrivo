<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDrivo Admin | Secure Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    // Immediate auth check: if already logged in this session, skip to dashboard
    if (sessionStorage.getItem('smartdrivo_admin_auth') === 'true') {
      window.location.replace('index.html');
    }
  </script>
  <style>
    :root {
      --primary: #FF6600;
      --primary-hover: #E65100;
      --primary-light: rgba(255, 102, 0, 0.12);
      --bg-dark: #0F1115;
      --card-dark: #181B20;
      --card-border: #262B34;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --error-bg: #450A0A;
      --error-text: #F87171;
      --error-border: #991B1B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: radial-gradient(circle at top center, #1E1B18 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 102, 0, 0.08);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #FF7A00 0%, #E65100 100%);
      color: #FFFFFF;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 8px 24px rgba(255, 102, 0, 0.35);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .error-alert {
      display: none;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      padding: 13px 42px 13px 42px;
      background: #0D0F12;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      color: #FFFFFF;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .form-input:focus + .input-icon,
    .form-input:focus ~ .input-icon {
      color: var(--primary);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--primary);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(255, 102, 0, 0.3);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(255, 102, 0, 0.45);
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .security-note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--card-border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #38BDF8;
      font-weight: 600;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-logo">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <h1 class="brand-title">SmartDrivo Admin</h1>
        <p class="brand-subtitle">Secure Administration & Fleet Management</p>
      </div>

      <div id="errorMessage" class="error-alert">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="errorText">Invalid username or password. Please try again.</span>
      </div>

      <form id="loginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label for="username">Admin Username</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="username" 
              class="form-input" 
              placeholder="Enter admin username"
              autocomplete="username"
              required 
              autofocus
            >
            <i class="fa-solid fa-user-shield input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Admin Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="Enter secure password"
              autocomplete="current-password"
              required
            >
            <i class="fa-solid fa-lock input-icon"></i>
            <button 
              type="button" 
              class="toggle-password" 
              onclick="togglePasswordVisibility()" 
              aria-label="Toggle password visibility"
            >
              <i id="eyeIcon" class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-login">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Login to Admin Panel</span>
        </button>
      </form>

      <div class="security-note">
        <div class="security-badge">
          <i class="fa-solid fa-lock"></i> End-to-End Protected Session
        </div>
        <p>Session automatically expires when this browser tab is closed.</p>
      </div>
    </div>
  </div>

  <script>
    // Hardcoded credentials
    const ADMIN_USER = 'kkaleem4u';
    const ADMIN_PASS = 'k@leem4yoU';

    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorBox = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');

      const user = usernameInput.value.trim();
      const pass = passwordInput.value;

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        // Successful login
        errorBox.style.display = 'none';
        loginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
        loginBtn.disabled = true;

        // Save session authentication in sessionStorage (cleared when browser/tab closes)
        sessionStorage.setItem('smartdrivo_admin_auth', 'true');
        sessionStorage.setItem('smartdrivo_admin_user', user);
        sessionStorage.setItem('smartdrivo_admin_logged_at', new Date().toISOString());

        setTimeout(() => {
          // Redirect to dashboard
          window.location.replace('index.html');
        }, 350);
      } else {
        // Failed login
        errorText.textContent = 'Invalid credentials. Please enter correct username and password.';
        errorBox.style.display = 'flex';
        passwordInput.value = '';
        passwordInput.focus();
      }
    }
  </script>

</body>
</html>
